[project]
name = "mcp-server-jev-client"
version = "0.1.0"
description = "First-person Godot observations summarized by Gemini and evaluated by Jev"
readme = "README.md"
authors = [
    { name = "digitalyoshixi", email = "digitalyoshixi@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "backboard-sdk>=1.5.19",
    "fastapi>=0.115,<1",
    "google-genai>=1,<3",
    "httpx>=0.28.1",
    "httpx2>=2.13,<3",
    "mcp[cli]>=2.2.0,<3",
    "mlx[cpu]>=0.32.2",
    "numpy>=2.5.3",
    "onnx-asr[gpu,hub]>=0.12.0",
    "onnxruntime-gpu<1.24",
    "parakeet-mlx>=0.5.2",
    "pydantic>=2.13.5,<3",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: requires rendered Godot and paid Gemini/Backboard API access"]

[tool.uv]
# This checkout runs root-level scripts; it has no installable src/ package.
package = false

[project.optional-dependencies]
voice = [
    "mlx>=0.32.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.3",
    "parakeet-mlx>=0.5.2 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "pynput>=1.8.2",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
]
